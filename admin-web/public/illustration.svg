      <rect x="88" y="200" width="12" height="18"/>
      <rect x="70" y="226" width="12" height="18"/>
      <rect x="88" y="226" width="12" height="18"/>
      <rect x="70" y="252" width="12" height="18"/>
      <rect x="88" y="252" width="12" height="18"/>
