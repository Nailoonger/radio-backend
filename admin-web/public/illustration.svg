    <ellipse cx="30" cy="370" rx="18" ry="22"/>
    <line x1="30" y1="390" x2="30" y2="430" stroke-width="2.5"/>
    <ellipse cx="100" cy="395" rx="14" ry="18"/>
    <line x1="100" y1="411" x2="100" y2="445"/>
    <ellipse cx="345" cy="395" rx="16" ry="20"/>
    <line x1="345" y1="413" x2="345" y2="450"/>
