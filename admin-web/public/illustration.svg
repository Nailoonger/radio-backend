<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cityBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cityFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- 背景渐变 -->
  <rect width="400" height="480" fill="url(#bg)"/>

  <!-- 装饰圆 -->
  <circle cx="60" cy="80" r="40" fill="#ffffff" opacity="0.3"/>
  <circle cx="60" cy="80" r="28" fill="#ffffff" opacity="0.5"/>

  <!-- 远景楼群 -->
