      <line x1="266" y1="180" x2="266" y2="330"/>
      <line x1="242" y1="200" x2="282" y2="200"/>
      <line x1="242" y1="220" x2="282" y2="220"/>
      <line x1="242" y1="240" x2="282" y2="240"/>
      <line x1="242" y1="260" x2="282" y2="260"/>
      <line x1="242" y1="280" x2="282" y2="280"/>
      <line x1="242" y1="300" x2="282" y2="300"/>
      <line x1="293" y1="160" x2="293" y2="330"/>
      <line x1="307" y1="160" x2="307" y2="330"/>
      <line x1="285" y1="180" x2="321" y2="180"/>
