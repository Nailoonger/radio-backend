    <rect x="325" y="170" width="32" height="170" fill="url(#cityBack)" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="200" y="190" width="34" height="150" fill="url(#cityBack)" stroke="#0ea5e9" stroke-width="2"/>
    <g stroke="#0ea5e9" stroke-width="1" fill="none">
