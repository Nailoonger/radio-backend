user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;

    # ---- HTTP（80）----
    # 1) 域名访问 → 全部 301 跳 HTTPS
    server {
        listen 80;
        server_name jyradio.online www.jyradio.online;

        # 备案核验/健康检查探针保留直通
        location = /health {
            proxy_pass http://radio-backend:3000/health;
            access_log off;
        }

        location / {
            return 301 https://jyradio.online$request_uri;
        }
    }

    # 2) 默认 80（IP 直访 / 本地调试）→ 保持原样走 HTTP，不影响真机调试
    server {
        listen 80 default_server;
        server_name _;

        # 健康检查
        location = /health {
            proxy_pass http://radio-backend:3000/health;
            access_log off;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://radio-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # 头像静态文件
        location /uploads/ {
            proxy_pass http://radio-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
        }

        # Swagger UI
        location /api-docs/ {
            proxy_pass http://radio-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 管理后台 SPA
        location / {
            proxy_pass http://admin-web:80;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- HTTPS 服务（443，正式证书 jyradio.online）----
    # 证书目录：宿主机 ./deploy/certs → 容器 /etc/nginx/certs（ro 挂载）
    # 证书 90 天有效，到期前重新申请并替换文件后 reload。
    server {
        listen 443 ssl;
        http2 on;
        server_name jyradio.online;

        ssl_certificate     /etc/nginx/certs/jyradio.online.pem;
        ssl_certificate_key /etc/nginx/certs/jyradio.online.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 健康检查
        location = /health {
            proxy_pass http://radio-backend:3000/health;
            access_log off;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://radio-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # 头像静态文件
        location /uploads/ {
            proxy_pass http://radio-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
        }

        # Swagger UI
        location /api-docs/ {
            proxy_pass http://radio-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 管理后台 SPA
        location / {
            proxy_pass http://admin-web:80;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
