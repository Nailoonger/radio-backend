<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>avslot 对比度实渲</title>
<style>
  /* 本文件是「实渲器」：把 availability.wxss 的 .avslot 规则按 1rpx = 0.5px 换算成 px，
     用 headless Chrome 真渲染出来截图。不在这里自创任何色值/尺寸。
     #before → 套用被删掉的那条 .avslot.off（灰底 + 透明描边）；#after → 只有基础态。 */
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 375px; background: #F5F5F7; color: #1D1D1F;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* .page{padding:0 32rpx; background:var(--parchment)} —— 32rpx = 16px */
  .page { padding: 16px; background: #F5F5F7; }

  /* .days{display:flex;flex-direction:column;gap:14rpx} */
  .days { display: flex; flex-direction: column; gap: 7px; }

  /* .day-hd{display:flex;align-items:baseline;padding:0 6rpx 14rpx} */
  .day-hd { display: flex; align-items: baseline; padding: 0 3px 7px; }
  .day-name { font-size: 14px; font-weight: 600; color: #1D1D1F; }
  .day-date { margin-left: 6px; font-size: 11.5px; color: #76767E; }
  .day-cnt { margin-left: auto; font-size: 9.5px; color: #76767E; font-variant-numeric: tabular-nums; }

  /* .avg{display:flex;gap:12rpx} */
  .avg { display: flex; gap: 6px; }

  /* .avslot —— 基础态：白底 + 灰描边 + 深色字（原型 v151 的未选中形态） */
  .avslot {
    flex: 1 1 0; min-width: 0; min-height: 48px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 6px 3px;
    border-radius: 10px;
    border: 1px solid #E2E2E7;
    background: #FFF;
  }
  .avslot-t { font-size: 11.5px; font-weight: 500; color: #1D1D1F; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avslot-s { font-size: 9.5px; color: #76767E; font-variant-numeric: tabular-nums; }

  /* .avslot.on —— 能来 */
  .avslot.on { background: #EAF3FD; border-color: #0066CC; }
  .avslot.on .avslot-t { color: #0066CC; font-weight: 600; }
  .avslot.on .avslot-s { color: #0066CC; opacity: .8; }

  /* ⚠️ 仅 #before 生效：这就是被删掉的那条规则 */
  body.v-before .avslot.off { background: #F5F5F7; border-color: transparent; }
  body.v-before .avslot.off .avslot-t { color: #76767E; font-weight: 400; }
</style>
</head>
<body class="v-after">
  <div class="page">
    <div class="days">
      <div class="day">
        <div class="day-hd"><span class="day-name">周一</span><span class="day-date">10/26</span><span class="day-cnt">1 / 3 个时段</span></div>
        <div class="avg">
          <div class="avslot on"><span class="avslot-t">早会</span><span class="avslot-s">07:30-07:50</span></div>
          <div class="avslot off"><span class="avslot-t">午间</span><span class="avslot-s">12:00-12:30</span></div>
          <div class="avslot off"><span class="avslot-t">傍晚</span><span class="avslot-s">17:00-17:30</span></div>
        </div>
      </div>
      <div class="day">
        <div class="day-hd"><span class="day-name">周二</span><span class="day-date">10/27</span><span class="day-cnt">0 / 3 个时段</span></div>
        <div class="avg">
          <div class="avslot off"><span class="avslot-t">早会</span><span class="avslot-s">07:30-07:50</span></div>
          <div class="avslot off"><span class="avslot-t">午间</span><span class="avslot-s">12:00-12:30</span></div>
          <div class="avslot off"><span class="avslot-t">傍晚</span><span class="avslot-s">17:00-17:30</span></div>
        </div>
      </div>
    </div>
  </div>
<script>
  if (location.hash === '#before') {
    document.body.className = 'v-before';
  } else {
    document.body.className = 'v-after';
  }
</script>
</body>
</html>
